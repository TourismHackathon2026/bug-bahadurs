version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: aawaz_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: aawaz
      POSTGRES_PASSWORD: aawaz_password
      POSTGRES_DB: awaaz
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: aawaz_redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
  mailpit:
    image: axllent/mailpit:edge
    container_name: mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"
    volumes:
      - mailpit-data:/data
volumes:
  postgres_data:
  redis_data:
  mailpit-data:
