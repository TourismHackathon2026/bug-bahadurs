services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: aawaz
      POSTGRES_PASSWORD: aawaz
      POSTGRES_DB: aawaz_dev
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U aawaz -d aawaz_dev']
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    ports:
      - '3000:3000'
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    develop:
      watch:
        - path: src
          action: sync
          target: /app/src
        - path: package.json
          action: rebuild

volumes:
  pgdata:
